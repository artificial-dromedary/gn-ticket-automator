name = "kit-control"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   QUSTODIO_EMAIL
#   QUSTODIO_PASSWORD
#   QUSTODIO_CLIENT_ID
#   QUSTODIO_CLIENT_SECRET
#   KIT_CONTROL_TOKEN

# Create with:
#   wrangler kv namespace create KIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "KIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
