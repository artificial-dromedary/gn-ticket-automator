services:
  - type: redis
    name: gn-ticket-redis
    plan: starter

  # All three services build from the same Dockerfile: the web service runs Selenium
  # in a thread for manual booking, and the worker runs it for automated booking, so
  # both need Chromium available.
  - type: web
    name: gn-ticket-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn main:app --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 120 --workers 1 --threads 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gn-ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gn-ticket-redis
          type: redis
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CHATGPT_API_KEY
        sync: false
      - key: AUTO_SCAN_TZ
        value: America/Toronto
      - key: AUTO_SCAN_HOUR
        value: "6"
      - key: AUTO_SCAN_MINUTE
        value: "0"

  - type: worker
    name: gn-ticket-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # One Chrome per worker: booking is memory-hungry on a starter plan.
    dockerCommand: celery -A tasks.celery_app worker -l info --concurrency 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gn-ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gn-ticket-redis
          type: redis
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CHATGPT_API_KEY
        sync: false
      - key: AUTO_SCAN_TZ
        value: America/Toronto
      - key: AUTO_SCAN_HOUR
        value: "6"
      - key: AUTO_SCAN_MINUTE
        value: "0"

  - type: worker
    name: gn-ticket-beat
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A tasks.celery_app beat -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gn-ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gn-ticket-redis
          type: redis
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CHATGPT_API_KEY
        sync: false
      - key: AUTO_SCAN_TZ
        value: America/Toronto
      - key: AUTO_SCAN_HOUR
        value: "6"
      - key: AUTO_SCAN_MINUTE
        value: "0"

databases:
  - name: gn-ticket-db
    plan: starter
    databaseName: gn_ticket
