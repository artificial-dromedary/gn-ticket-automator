# Cron-job architecture: one web service for the dashboard and one scheduled job that
# does the daily scan and booking. No Redis and no long-running worker — the scan is a
# short daily process, and Render bills cron jobs per minute of execution.
#
# The Celery task definitions in tasks.py are still present and still work. Setting
# GN_INLINE_TASKS=1 makes them run in-process instead of being enqueued, so a future
# move to a worker + beat deployment is a configuration change, not a rewrite.

envVarGroups:
  - name: gn-ticket-shared
    envVars:
      # Encrypts every stored Airtable key, ServiceNow password and 2FA secret.
      # Generate once; losing it means every user redoes the setup wizard.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # The database is created and managed by hand rather than by this blueprint, so
      # the URL is set in the dashboard. It lives in the shared group, not on each
      # service, because it was previously declared twice — and repointing at a new
      # database updated one of them and left the cron job talking to a host that no
      # longer resolved. One declaration cannot drift from itself.
      #
      # Use the database's INTERNAL URL: both services run on Render, and internal
      # traffic stays on the private network instead of the public internet. It
      # requires the database to be in the same account and region as the services.
      #
      # The database itself: a paid instance with 1 GB of storage. Storage bills at
      # $0.30/GB/month, and this only ever holds text — users, tickets, scan results,
      # sessions — so the 15 GB it was originally built with cost $4.50/month for
      # nothing. Deliberately NOT the free instance type: free Postgres expires 30
      # days after creation and cannot be upgraded, and this holds every user's
      # encrypted Airtable key, ServiceNow password and 2FA secret. Compute is the
      # same 256 MB / 0.1 CPU either way.
      - key: DATABASE_URL
        sync: false
      - key: GN_INLINE_TASKS
        value: "1"
      - key: AUTO_SCAN_TZ
        value: America/Toronto
      # End-of-day summary: the first hourly run at or after this local hour sends it.
      - key: DAILY_SUMMARY_HOUR
        value: "17"
      - key: DAILY_SUMMARY_TZ
        value: America/New_York
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CHATGPT_API_KEY
        sync: false
      # Optional. Overridable so a model retirement is a dashboard edit, not a deploy.
      - key: CHATGPT_MODEL
        value: gpt-5-mini

services:
  - type: web
    name: gn-ticket-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # Manual booking drives Chrome inside this process. Measured peak is ~355 MB of the
    # 512 MB a starter instance gets, so one browser fits and a second would not.
    dockerCommand: gunicorn main:app --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 120 --workers 1 --threads 2
    healthCheckPath: /
    envVars:
      - fromGroup: gn-ticket-shared
      - key: DISABLE_UPDATES
        value: "1"
      # Manual booking drives Chrome in this process, which 512 MB cannot survive.
      # Booking here is scheduled only; on-demand booking lives in the desktop app.
      - key: GN_ENABLE_MANUAL_BOOKING
        value: "false"
      # Lets "Run scan now" start the scan job, which has the memory for a browser.
      # Without these the button records the request and the next check picks it up.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_CRON_JOB_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false

  - type: cron
    name: gn-ticket-scan
    runtime: docker
    # 2 GB, so Chrome has room. Cron jobs bill per minute of execution, so the larger
    # instance costs cents per month at one short run per day.
    plan: standard
    dockerfilePath: ./Dockerfile
    # Fires hourly and scans only the users whose chosen interval has elapsed, so
    # per-person frequency (1/5/12/24h) is a dashboard setting rather than a schedule
    # change. A run with nobody due exits in seconds, and cron jobs bill per minute.
    schedule: "0 * * * *"
    dockerCommand: python run_scan.py
    envVars:
      - fromGroup: gn-ticket-shared
